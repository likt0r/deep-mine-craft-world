# Caddy nimmt die Konfiguration aus dem Paket deep-mine-control statt /etc/caddy/Caddyfile.
# /etc/caddy/Caddyfile gehört dem caddy-Paket (conffile); überschrieben würde jedes caddy-Update nachfragen.
[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /usr/lib/deep-mine-control/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /usr/lib/deep-mine-control/Caddyfile --force
