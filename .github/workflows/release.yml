# Release per Knopf: release-it zählt die Version aus dem letzten Tag hoch, setzt den Tag vX.Y.Z und legt das
# GitHub-Release mit Änderungsliste aus den Commit-Titeln an (kein Versions-Commit, main ist geschützt).
# Danach wird das Paket aus genau diesem Tag gebaut und mit Prüfsumme ans Release gehängt.
# Auch per Kommandozeile:  gh workflow run release -f increment=minor
name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Welcher Teil der Version steigt
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release

jobs:
  release:
    # Nur von main: dort kommt nur an, was die CI-Pipeline grün gesehen hat.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Git-Benutzer für den Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release anlegen
        run: npx --yes release-it@21.1.1 --ci --increment "$INCREMENT"
        env:
          INCREMENT: ${{ inputs.increment }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"

  package:
    needs: release
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: v${{ needs.release.outputs.version }}

  upload:
    needs: [release, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Paket ans Release hängen
        run: gh release upload "v$VERSION" dist/*.deb dist/*.deb.sha256 --repo "$GITHUB_REPOSITORY"
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
