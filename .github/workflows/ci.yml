name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: npm 11 installieren
        run: npm install -g npm@11

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API-Tests
        run: npm test

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Seitentests
        run: npm run test:e2e

      # Traces der fehlgeschlagenen Seitentests (trace: retain-on-failure)
      - name: Playwright-Traces hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: control/test-results
          if-no-files-found: ignore
          retention-days: 14
